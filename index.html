<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Jexkode — Web3 Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --green: #00ff88;
    --green-dim: #00cc6a;
    --green-glow: rgba(0,255,136,0.18);
    --green-border: rgba(0,255,136,0.25);
    --bg: #030b05;
    --bg2: #060f08;
    --bg3: #0a160d;
    --text: #e6ffe8;
    --muted: #5a7a60;
    --card: rgba(0,255,136,0.04);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    overflow-x: hidden;
    cursor: none;
  }

  /* Custom Cursor */
  .cursor {
    width: 12px; height: 12px;
    background: var(--green);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    transition: transform 0.1s;
    box-shadow: 0 0 12px var(--green), 0 0 30px rgba(0,255,136,0.4);
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1.5px solid rgba(0,255,136,0.5);
    border-radius: 50%;
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9998;
    transition: transform 0.18s ease, width 0.2s, height 0.2s;
  }

  /* Grid overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  /* Noise texture */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
  }

  /* NAV */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 60px;
    background: rgba(3,11,5,0.85);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--green-border);
  }
  .nav-logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1.3rem;
    color: var(--green);
    letter-spacing: 0.12em;
    text-shadow: 0 0 18px rgba(0,255,136,0.5);
  }
  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 600;
    transition: color 0.2s;
    position: relative;
  }
  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 0;
    width: 0; height: 1px;
    background: var(--green);
    transition: width 0.3s;
    box-shadow: 0 0 8px var(--green);
  }
  .nav-links a:hover { color: var(--green); }
  .nav-links a:hover::after { width: 100%; }
  .nav-cta {
    background: transparent;
    border: 1px solid var(--green);
    color: var(--green);
    padding: 8px 22px;
    font-family: 'Syne', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: none;
    transition: background 0.2s, box-shadow 0.2s;
    font-weight: 600;
  }
  .nav-cta:hover {
    background: rgba(0,255,136,0.1);
    box-shadow: 0 0 20px rgba(0,255,136,0.3);
  }

  /* HERO */
  #hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 140px 60px 80px;
    position: relative;
    z-index: 1;
  }
  .hero-tag {
    font-family: 'Orbitron', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.3em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .hero-tag::before {
    content: '';
    width: 40px; height: 1px;
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
  }
  .hero-name {
    font-family: 'Orbitron', monospace;
    font-size: clamp(3.5rem, 9vw, 8rem);
    font-weight: 900;
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 10px;
  }
  .hero-name span {
    color: var(--green);
    text-shadow: 0 0 40px rgba(0,255,136,0.5), 0 0 80px rgba(0,255,136,0.2);
  }
  .hero-role {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1rem, 2.5vw, 1.6rem);
    font-weight: 400;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 40px;
    margin-top: 10px;
  }
  .hero-desc {
    max-width: 520px;
    font-size: 1rem;
    line-height: 1.75;
    color: rgba(230,255,232,0.55);
    margin-bottom: 50px;
    font-weight: 400;
  }
  .hero-btns {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .btn-primary {
    background: var(--green);
    color: #030b05;
    padding: 14px 36px;
    font-family: 'Orbitron', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: none;
    cursor: none;
    text-decoration: none;
    display: inline-block;
    transition: box-shadow 0.3s, transform 0.2s;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-primary:hover {
    box-shadow: 0 0 40px rgba(0,255,136,0.7), 0 0 80px rgba(0,255,136,0.3);
    transform: translateY(-2px);
  }
  .btn-outline {
    background: transparent;
    color: var(--green);
    padding: 14px 36px;
    font-family: 'Orbitron', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border: 1px solid var(--green-border);
    cursor: none;
    text-decoration: none;
    display: inline-block;
    transition: border-color 0.3s, background 0.3s;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .btn-outline:hover {
    border-color: var(--green);
    background: rgba(0,255,136,0.07);
  }

  /* Hero orb */
  .hero-orb {
    position: absolute;
    right: -100px;
    top: 50%;
    transform: translateY(-50%);
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,255,136,0.08) 0%, rgba(0,255,136,0.03) 40%, transparent 70%);
    border: 1px solid rgba(0,255,136,0.1);
    animation: pulse 4s ease-in-out infinite;
    pointer-events: none;
  }
  .hero-orb::after {
    content: '';
    position: absolute;
    inset: 40px;
    border-radius: 50%;
    border: 1px solid rgba(0,255,136,0.08);
    animation: pulse 4s ease-in-out infinite reverse;
  }
  @keyframes pulse {
    0%, 100% { transform: translateY(-50%) scale(1); opacity: 1; }
    50% { transform: translateY(-50%) scale(1.04); opacity: 0.7; }
  }

  /* Stats bar */
  .stats-bar {
    position: absolute;
    bottom: 50px;
    left: 60px;
    right: 60px;
    display: flex;
    gap: 60px;
    border-top: 1px solid var(--green-border);
    padding-top: 30px;
  }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-num {
    font-family: 'Orbitron', monospace;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--green);
    text-shadow: 0 0 20px rgba(0,255,136,0.4);
  }
  .stat-label {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* SECTIONS */
  section { position: relative; z-index: 1; }

  .section-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 60px;
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 16px;
  }
  .section-num {
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    color: var(--green);
    letter-spacing: 0.2em;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--green-border), transparent);
  }
  .section-title {
    font-family: 'Orbitron', monospace;
    font-size: clamp(1.8rem, 4vw, 2.8rem);
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    letter-spacing: 0.04em;
  }
  .section-title span { color: var(--green); }
  .section-sub {
    font-size: 0.95rem;
    color: rgba(230,255,232,0.45);
    line-height: 1.7;
    max-width: 520px;
    margin-bottom: 60px;
  }

  /* ABOUT */
  #about { padding: 130px 0; }
  .about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .about-visual {
    position: relative;
    height: 420px;
  }
  .about-hex {
    position: absolute;
    width: 320px;
    height: 320px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid var(--green-border);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    background: var(--card);
    animation: hexSpin 20s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .about-hex-inner {
    font-family: 'Orbitron', monospace;
    font-size: 3.5rem;
    font-weight: 900;
    color: var(--green);
    text-shadow: 0 0 40px rgba(0,255,136,0.6);
    animation: hexSpin 20s linear infinite reverse;
  }
  @keyframes hexSpin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .about-ring {
    position: absolute;
    width: 380px; height: 380px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(0,255,136,0.12);
    border-radius: 50%;
    animation: ringRotate 30s linear infinite;
  }
  @keyframes ringRotate { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .about-text h3 {
    font-family: 'Orbitron', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.15em;
    margin-bottom: 20px;
  }
  .about-text p {
    font-size: 0.95rem;
    line-height: 1.85;
    color: rgba(230,255,232,0.55);
    margin-bottom: 20px;
  }
  .skills-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 30px;
  }
  .chip {
    padding: 6px 16px;
    border: 1px solid var(--green-border);
    font-family: 'Orbitron', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    color: var(--green);
    text-transform: uppercase;
    background: rgba(0,255,136,0.03);
    transition: background 0.2s, box-shadow 0.2s;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  }
  .chip:hover {
    background: rgba(0,255,136,0.1);
    box-shadow: 0 0 16px rgba(0,255,136,0.2);
  }

  /* SERVICES */
  #services { padding: 130px 0; background: var(--bg2); }
  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .service-card {
    padding: 36px 30px;
    border: 1px solid var(--green-border);
    background: var(--card);
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  }
  .service-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,255,136,0.06) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .service-card:hover {
    border-color: rgba(0,255,136,0.5);
    box-shadow: 0 0 40px rgba(0,255,136,0.12), inset 0 0 40px rgba(0,255,136,0.03);
    transform: translateY(-4px);
  }
  .service-card:hover::before { opacity: 1; }
  .service-icon {
    font-size: 2rem;
    margin-bottom: 20px;
    display: block;
  }
  .service-card h3 {
    font-family: 'Orbitron', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--green);
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .service-card p {
    font-size: 0.88rem;
    line-height: 1.75;
    color: rgba(230,255,232,0.45);
  }

  /* WORK */
  #work { padding: 130px 0; }
  .work-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .work-card {
    border: 1px solid var(--green-border);
    background: var(--card);
    overflow: hidden;
    position: relative;
    transition: transform 0.3s, box-shadow 0.3s;
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
  }
  .work-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 60px rgba(0,255,136,0.12);
  }
  .work-thumb {
    width: 100%;
    height: 220px;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    border-bottom: 1px solid var(--green-border);
    position: relative;
    overflow: hidden;
  }
  .work-thumb::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,255,136,0.04) 0%, transparent 70%);
  }
  .work-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    color: var(--muted);
  }
  .work-placeholder svg {
    width: 40px; height: 40px;
    opacity: 0.4;
  }
  .work-placeholder span {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.4;
  }
  .upload-hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,255,136,0.07);
    opacity: 0;
    transition: opacity 0.3s;
    font-family: 'Orbitron', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--green);
    text-transform: uppercase;
  }
  .work-card:hover .upload-hint { opacity: 1; }
  .work-info {
    padding: 20px 24px 24px;
  }
  .work-tag {
    font-family: 'Orbitron', monospace;
    font-size: 0.58rem;
    letter-spacing: 0.25em;
    color: var(--green);
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.7;
  }
  .work-info h3 {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .work-info p {
    font-size: 0.82rem;
    color: rgba(230,255,232,0.4);
    line-height: 1.65;
  }

  /* PROCESS */
  #process { padding: 130px 0; background: var(--bg2); }
  .process-steps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    position: relative;
  }
  .process-steps::before {
    content: '';
    position: absolute;
    top: 36px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--green-border), transparent);
  }
  .process-step {
    padding: 30px 24px;
    background: var(--card);
    border: 1px solid var(--green-border);
    position: relative;
    transition: background 0.3s;
  }
  .process-step:hover { background: rgba(0,255,136,0.05); }
  .step-num {
    font-family: 'Orbitron', monospace;
    font-size: 2.5rem;
    font-weight: 900;
    color: rgba(0,255,136,0.1);
    display: block;
    margin-bottom: 20px;
    line-height: 1;
  }
  .process-step h3 {
    font-family: 'Orbitron', monospace;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--green);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .process-step p {
    font-size: 0.85rem;
    color: rgba(230,255,232,0.4);
    line-height: 1.7;
  }

  /* CONTACT */
  #contact { padding: 130px 0; }
  .contact-inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: start;
  }
  .contact-left h2 {
    font-family: 'Orbitron', monospace;
    font-size: clamp(2rem, 4vw, 3rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 24px;
  }
  .contact-left h2 span { color: var(--green); }
  .contact-left p {
    font-size: 0.95rem;
    line-height: 1.8;
    color: rgba(230,255,232,0.45);
    margin-bottom: 36px;
  }
  .contact-email {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 24px;
    border: 1px solid var(--green-border);
    background: var(--card);
    text-decoration: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }
  .contact-email:hover {
    border-color: var(--green);
    box-shadow: 0 0 30px rgba(0,255,136,0.15);
  }
  .contact-email-icon {
    width: 36px; height: 36px;
    border: 1px solid var(--green-border);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--green);
    font-size: 0.9rem;
    flex-shrink: 0;
  }
  .contact-email-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .contact-email-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .contact-email-val {
    font-size: 0.9rem;
    color: var(--text);
    font-weight: 600;
  }
  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-label {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .form-input, .form-textarea {
    background: var(--bg3);
    border: 1px solid var(--green-border);
    color: var(--text);
    padding: 14px 18px;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  .form-input:focus, .form-textarea:focus {
    border-color: rgba(0,255,136,0.5);
    box-shadow: 0 0 20px rgba(0,255,136,0.08);
  }
  .form-textarea { resize: vertical; min-height: 120px; }
  .form-input::placeholder, .form-textarea::placeholder { color: var(--muted); }

  /* FOOTER */
  footer {
    border-top: 1px solid var(--green-border);
    padding: 40px 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }
  .footer-logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1rem;
    color: var(--green);
    letter-spacing: 0.12em;
    text-shadow: 0 0 18px rgba(0,255,136,0.4);
  }
  .footer-copy {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .footer-socials {
    display: flex;
    gap: 20px;
  }
  .footer-socials a {
    font-family: 'Orbitron', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-decoration: none;
    text-transform: uppercase;
    transition: color 0.2s;
  }
  .footer-socials a:hover { color: var(--green); }

  /* Scan line animation */
  .scanline {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
